name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  jest:
    name: Jest (unit + integración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Jest
        run: npm test

  smoke-api:
    name: Newman Smoke (API)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/petconnect_smoke_ci
      JWT_SECRET: ci-jwt-secret-petconnect
      JWT_EXPIRES_IN: 1h
      NODE_ENV: development
      PORT: 3000
      CLIENT_URL: http://localhost:5173
      PETCONNECT_API_SCOPE: full
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Seed datos smoke
        run: node scripts/seed-smoke.js

      - name: Iniciar API en background
        run: |
          node src/server.js &
          echo $! > server.pid

      - name: Esperar health check
        run: node scripts/wait-for-health.js

      - name: Ejecutar Newman (carpeta Smoke)
        run: npm run test:smoke

      - name: Detener servidor
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
